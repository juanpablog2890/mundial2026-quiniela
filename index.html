// =====================================================================
//  Hash simple SHA-256 para contraseñas
// =====================================================================
async function hashPass(pw) {
  const buf = new TextEncoder().encode(pw + "mundial26-salt");
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
}

  const ph = parseInt(pred.home), pa = parseInt(pred.away);
  const rh = parseInt(result.home), ra = parseInt(result.away);
  if (isNaN(ph) || isNaN(pa) || isNaN(rh) || isNaN(ra)) return null;
  if (ph === rh && pa === ra) return SCORING.EXACT;
  const pw = ph > pa ? "h" : pa > ph ? "a" : "d";
  const rw = rh > ra ? "h" : ra > rh ? "a" : "d";
  return pw === rw ? SCORING.WINNER : 0;
}

// =====================================================================
//  Toast
// =====================================================================
function toast(msg, type = "ok") {
  const old = document.querySelector(".toast");
  if (old) old.remove();
  const el = document.createElement("div");
  el.className = "toast" + (type === "error" ? " error" : "");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

function normalizePredictionRows(rows) {
  const byUserMatch = {};
  (rows || []).forEach(p => {
    byUserMatch[`${p.user_name}::${p.match_id}`] = p;
  });
  return Object.values(byUserMatch);
}

// =====================================================================
//  Carga de datos remota
// =====================================================================
async function loadAll() {
  if (!state.sb) return;
  try {
    const userPredsQuery = state.user
      ? state.sb
          .from("predictions")
          .select("*")
          .eq("user_name", state.user.name)
          .order("updated_at", { ascending: true })
          .range(0, 200)
      : Promise.resolve({ data: [] });

    const [users, preds, userPreds, res, settings] = await Promise.all([
      state.sb.from("users").select("name"),
      state.sb.from("predictions").select("*").order("updated_at", { ascending: true }).range(0, 5000),
      userPredsQuery,
      state.sb.from("results").select("*"),
      state.sb.from("settings").select("*"),
    ]);
    state.allUsers = users.data || [];
    state.allPredictions = normalizePredictionRows(preds.data || []);
    state.results = {};
    (res.data || []).forEach(r => {
      state.results[r.match_id] = { home: r.home_score, away: r.away_score };
    });
    // Estado del bloqueo individual de partidos
    const settingsMap = {};
    (settings.data || []).forEach(s => { settingsMap[s.key] = s.value; });
    try {
      const lockedArr = settingsMap.locked_matches ? JSON.parse(settingsMap.locked_matches) : [];
      state.lockedMatches = new Set(lockedArr);
    } catch (e) { state.lockedMatches = new Set(); }
    // Compatibilidad con versión anterior: si había bloqueo global, migrar
    if (settingsMap.predictions_locked === "1" && state.lockedMatches.size === 0) {
      state.lockedMatches = new Set(MATCHES.map(m => m.id));
    }
    if (state.user) {
      state.predictions = {};
      normalizePredictionRows(userPreds.data || [])
        .forEach(p => {
          state.predictions[p.match_id] = { home: p.home_score, away: p.away_score };
        });
    }
  } catch (e) {
    console.error(e);
    toast("Error al cargar datos", "error");
  }
}

async function loadComparePredictions(userName) {
  if (!state.sb || !userName) return;
  state.compareLoading = userName;
  const { data, error } = await state.sb
    .from("predictions")
    .select("*")
    .eq("user_name", userName)
    .order("updated_at", { ascending: true })
    .range(0, 200);

  if (error) {
    state.compareLoading = null;
    toast("Error al cargar picks de " + userName + ": " + error.message, "error");
    return;
  }

  const preds = {};
  normalizePredictionRows(data || []).forEach(p => {
    preds[p.match_id] = { home: p.home_score, away: p.away_score };
  });
  state.comparePredictions[userName] = preds;
  state.compareLoading = null;

  if (state.view === "compare" && state.compareWith === userName) renderCompare();
}

async function login(name, password) {
  name = name.trim();
  if (!name || !password) return toast("Completa nombre y contraseña", "error");
  const hash = await hashPass(password);
  const { data: existing } = await state.sb.from("users").select("*").eq("name", name).maybeSingle();
  if (!existing) {
    return toast("Usuario no encontrado. Pídele al admin que te cree una cuenta.", "error");
  }
  if (existing.pass_hash !== hash) return toast("Contraseña incorrecta", "error");
  state.user = { name };
  localStorage.setItem("mundial26_user", JSON.stringify(state.user));
  await loadAll();
  state.view = "predict";
  render();
  toast("¡Bienvenido " + name + "!");
}

function logout() {
  state.user = null;
  state.predictions = {};
  state.adminUnlocked = false;
  localStorage.removeItem("mundial26_user");
  state.view = "login";
  render();
}

// =====================================================================
//  Guardar predicción de un partido
// =====================================================================
async function savePrediction(matchId) {
  if (state.lockedMatches.has(matchId)) {
    toast("🔒 Ese partido ya está bloqueado", "error");
    return;
  }
  const p = state.predictions[matchId];
  if (!p || p.home === "" || p.away === "" || p.home == null || p.away == null) return;
  const h = parseInt(p.home), a = parseInt(p.away);
  if (isNaN(h) || isNaN(a) || h < 0 || a < 0) return;
  const payload = {
    user_name: state.user.name,
    match_id: matchId,
    home_score: h,
    away_score: a,
    updated_at: new Date().toISOString(),
  };

  const { data: updatedRows, error: updateError } = await state.sb
    .from("predictions")
    .update(payload)
    .eq("user_name", state.user.name)
    .eq("match_id", matchId)
    .select("user_name,match_id,home_score,away_score,updated_at");

  if (updateError) return toast("Error al guardar: " + updateError.message, "error");

  if (!updatedRows || updatedRows.length === 0) {
    const { error: insertError } = await state.sb.from("predictions").insert(payload);
    if (insertError) return toast("Error al guardar: " + insertError.message, "error");
  }

  const existingIndex = state.allPredictions.findIndex(row =>
    row.user_name === state.user.name && row.match_id === matchId
  );
  const savedRow = { ...payload };
  if (existingIndex >= 0) state.allPredictions[existingIndex] = savedRow;
  else state.allPredictions.push(savedRow);
}

function setPredField(matchId, side, val) {
  if (!state.predictions[matchId]) state.predictions[matchId] = { home: "", away: "" };
  state.predictions[matchId][side] = val;
}

const predSaveTimers = {};

function schedulePredictionSave(matchId) {
  clearTimeout(predSaveTimers[matchId]);
  predSaveTimers[matchId] = setTimeout(() => savePrediction(matchId), 300);
}

// =====================================================================
//  Admin: guardar resultado real
// =====================================================================
async function saveResult(matchId, home, away) {
  const h = parseInt(home), a = parseInt(away);
  if (isNaN(h) || isNaN(a) || h < 0 || a < 0) return toast("Marcador inválido", "error");
  const { error } = await state.sb.from("results").upsert({
    match_id: matchId,
    home_score: h,
    away_score: a,
    updated_at: new Date().toISOString(),
  });
  if (error) return toast("Error: " + error.message, "error");
  state.results[matchId] = { home: h, away: a };
  // Auto-bloquear el partido al ingresar resultado
  if (!state.lockedMatches.has(matchId)) {
    state.lockedMatches.add(matchId);
    await persistLockedMatches();
  }
  toast("✅ Resultado guardado y partido bloqueado");
  renderAdmin();
  const { data: preds } = await state.sb
    .from("predictions")
    .select("*")
    .order("updated_at", { ascending: true })
    .range(0, 5000);
  state.allPredictions = normalizePredictionRows(preds || []);
}

async function persistLockedMatches() {
  await state.sb.from("settings").upsert({
    key: "locked_matches",
    value: JSON.stringify(Array.from(state.lockedMatches)),
  });
}

async function toggleMatchLock(matchId) {
  if (state.lockedMatches.has(matchId)) {
    state.lockedMatches.delete(matchId);
    toast(`🔓 ${matchId} desbloqueado`);
  } else {
    state.lockedMatches.add(matchId);
    toast(`🔒 ${matchId} bloqueado`);
  }
  await persistLockedMatches();
  renderAdmin();
}

async function lockAllInGroup(g) {
  MATCHES.filter(m => m.group === g).forEach(m => state.lockedMatches.add(m.id));
  await persistLockedMatches();
  toast(`🔒 Grupo ${g} completamente bloqueado`);
  renderAdmin();
}

async function unlockAllInGroup(g) {
  MATCHES.filter(m => m.group === g).forEach(m => state.lockedMatches.delete(m.id));
  await persistLockedMatches();
  toast(`🔓 Grupo ${g} completamente desbloqueado`);
  renderAdmin();
}

async function lockAllByDate(dateStr) {
  MATCHES.filter(m => m.date === dateStr).forEach(m => state.lockedMatches.add(m.id));
  await persistLockedMatches();
  toast(`🔒 Partidos del ${dateStr} bloqueados`);
  renderAdmin();
}

window.onToggleMatchLock = toggleMatchLock;
window.onLockAllInGroup = lockAllInGroup;
window.onUnlockAllInGroup = unlockAllInGroup;
window.onLockAllByDate = lockAllByDate;

async function clearResult(matchId) {
  if (!confirm("¿Borrar el resultado de este partido?")) return;
  const { error } = await state.sb.from("results").delete().eq("match_id", matchId);
  if (error) return toast("Error: " + error.message, "error");
  delete state.results[matchId];
  toast("Resultado borrado");
  renderAdmin();
}

// =====================================================================
//  Tabla de posiciones
// =====================================================================
function getLeaderboard() {
  const totals = {};
  state.allUsers.forEach(u => { totals[u.name] = 0; });
  state.allPredictions.forEach(p => {
    const r = state.results[p.match_id];
    if (!r) return;
    const pts = calcPoints({ home: p.home_score, away: p.away_score }, r);
    if (pts != null && pts > 0) totals[p.user_name] = (totals[p.user_name] || 0) + pts;
  });
  return Object.entries(totals)
    .map(([name, pts]) => ({ name, pts }))
    .sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name));
}

function totalPointsForPredictions(preds) {
  let total = 0;
  Object.entries(preds || {}).forEach(([matchId, pred]) => {
    const result = state.results[matchId];
    if (!result) return;
    const pts = calcPoints(pred, result);
    if (pts != null && pts > 0) total += pts;
  });
  return total;
}

// Sortkey numérico para ordenar por fecha (junio 2026)
function dateSortKey(dateStr) {
  const m = dateStr.match(/(\d+)/);
  return m ? parseInt(m[1]) : 99;
}

function renderPredict() {
  const viewMode = state.predictView;
  const viewToggle = `
    <div style="display:flex;gap:6px;margin-bottom:12px;justify-content:center;">
      <button class="btn-secondary" style="${viewMode==='group'?'background:#facc15;color:#0f172a;border-color:#facc15;':''}" onclick="setPredView('group')">🔠 Por grupo</button>
      <button class="btn-secondary" style="${viewMode==='date'?'background:#facc15;color:#0f172a;border-color:#facc15;':''}" onclick="setPredView('date')">📅 Por fecha</button>
    </div>
  `;

  let bodyHtml = "";
  if (viewMode === "date") {

      byDate[m.date].push(m);

function renderCompare() {
  // Lista de usuarios disponibles para comparar (todos menos el actual)
  const otherUsers = state.allUsers.filter(u => u.name !== state.user.name);

  if (otherUsers.length === 0) {
    document.getElementById("app").innerHTML = `
      <div class="card">
        <h2>🆚 Comparar contra otro participante</h2>
        <p>Todavía no hay otros participantes registrados para comparar. Pídele al admin que cree más usuarios.</p>
      </div>
    `;
    return;
  }

  if (!state.compareWith || !otherUsers.find(u => u.name === state.compareWith)) {
    state.compareWith = otherUsers[0].name;
  }
  const otherName = state.compareWith;

  if (!state.comparePredictions[otherName] && state.compareLoading !== otherName) {
    loadComparePredictions(otherName);
  }

  // Mis predicciones ya están en state.predictions; las del otro usuario se cargan directo de Supabase.
  const otherPreds = state.comparePredictions[otherName] || {};
  const compareLoadingBanner = state.compareLoading === otherName ? `
    <div style="background:rgba(250,204,21,0.1);border:1px solid #facc15;color:#fde68a;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;text-align:center;">
      Cargando picks de ${otherName}...
    </div>` : "";

  const myTotalShown = totalPointsForPredictions(state.predictions);
  const otherTotalShown = totalPointsForPredictions(otherPreds);

  // Lista de partidos agrupados por fecha
  const byDate = {};
  MATCHES.forEach(m => {
    if (!byDate[m.date]) byDate[m.date] = [];
    byDate[m.date].push(m);
  });
  const sortedDates = Object.keys(byDate).sort((a, b) => dateSortKey(a) - dateSortKey(b));

  const dateSections = sortedDates.map(d => {
    const rows = byDate[d].map(m => {
      const myP = state.predictions[m.id];
      const otherP = otherPreds[m.id];
      const r = state.results[m.id];
      const myPText = myP && myP.home !== "" && myP.home != null ? `${myP.home}-${myP.away}` : "—";
      const otherPText = otherP ? `${otherP.home}-${otherP.away}` : "—";
      let myPts = "", otherPts = "";
      if (r) {
        if (myP) {
          const pts = calcPoints(myP, r);
          if (pts != null) { myPts = pts > 0 ? ` +${pts}` : ""; }
        }
        if (otherP) {
          const pts = calcPoints(otherP, r);
          if (pts != null) { otherPts = pts > 0 ? ` +${pts}` : ""; }
        }
      }
      const sameAsMe = myP && otherP && myP.home == otherP.home && myP.away == otherP.away;
      const realScore = r ? `<span class="small" style="opacity:.6;">real: ${r.home}-${r.away}</span>` : '';
      return `
        <div style="display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:8px;padding:6px 10px;background:rgba(0,0,0,0.2);border-radius:6px;margin-bottom:4px;font-size:13px;${sameAsMe?'border-left:3px solid #facc15;':''}">
          <div style="text-align:right;">
            <div>${flag(m.home)} ${m.home} <strong>vs</strong> ${m.away} ${flag(m.away)}</div>
            <div class="small" style="opacity:.5;">Grupo ${m.group} · ${realScore}</div>
          </div>
          <div style="text-align:center;font-weight:700;">
            <div style="color:#facc15;">${myPText}<span style="color:#4ade80;">${myPts}</span></div>
            <div class="small">vs</div>
            <div style="color:#94a3b8;">${otherPText}<span style="color:#4ade80;">${otherPts}</span></div>
          </div>
          <div>
            ${sameAsMe ? '<span class="badge">🟰 igual</span>' : ''}
          </div>
        </div>
      `;
    }).join("");
    return `
      <h3 style="margin-top:14px;">📅 ${d}</h3>
      ${rows}
    `;
  }).join("");

  const userOptions = otherUsers
    .slice()
    .sort((a, b) => a.name.localeCompare(b.name))
    .map(u => `<option value="${u.name}" ${u.name===otherName?'selected':''}>${u.name}</option>`)
    .join("");

  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>🆚 Comparar contra otro participante</h2>
      ${compareLoadingBanner}
      <div style="background:rgba(0,0,0,0.3);padding:14px;border-radius:8px;margin-bottom:16px;">
        <label>Comparar mis picks contra:</label>
        <select id="compareSelect" onchange="onCompareChange(this.value)" style="margin-top:4px;">
          ${userOptions}
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;text-align:center;">
        <div style="background:rgba(250,204,21,0.1);padding:12px;border-radius:8px;border:1px solid #facc15;">
          <div class="small">Tú · ${state.user.name}</div>
          <div style="font-size:24px;font-weight:800;color:#facc15;">${myTotalShown} pts</div>
        </div>
        <div style="background:rgba(148,163,184,0.1);padding:12px;border-radius:8px;border:1px solid #94a3b8;">
          <div class="small">${otherName}</div>
          <div style="font-size:24px;font-weight:800;color:#94a3b8;">${otherTotalShown} pts</div>
        </div>
      </div>
      <p class="small">Las filas con borde amarillo significan que ambos tienen el mismo pick.</p>
      ${dateSections}
    </div>
  `;
}

async function deleteUser(name) {
  if (!confirm(`¿Seguro que quieres ELIMINAR al usuario "${name}"?\n\nEsto borra también todas sus predicciones. NO se puede deshacer.`)) return;
  const { error } = await state.sb.from("users").delete().eq("name", name);
  if (error) return toast("Error: " + error.message, "error");
  toast(`🗑️ Usuario "${name}" eliminado`);
  await loadAll();
  renderAdmin();
}

async function resetPassword(name) {
  const newPw = prompt(`Asigna una nueva contraseña para "${name}":\n\n(El usuario deberá usar esta nueva contraseña la próxima vez que entre.)`);
  if (!newPw || newPw.trim().length < 1) return;
  const hash = await hashPass(newPw.trim());
  const { error } = await state.sb.from("users").update({ pass_hash: hash }).eq("name", name);
  if (error) return toast("Error: " + error.message, "error");
  toast(`🔑 Contraseña de "${name}" reseteada a: ${newPw.trim()}`);
}

async function createUser() {
  const name = (document.getElementById("newUserName").value || "").trim();
  const pass = (document.getElementById("newUserPass").value || "").trim();
  if (!name || !pass) return toast("Completa nombre y contraseña", "error");
  if (pass.length < 3) return toast("Contraseña muy corta (mínimo 3 caracteres)", "error");
  // Verificar si ya existe
  const { data: existing } = await state.sb.from("users").select("name").eq("name", name).maybeSingle();
  if (existing) return toast(`Ya existe un usuario con el nombre "${name}"`, "error");
  const hash = await hashPass(pass);
  const { error } = await state.sb.from("users").insert({ name, pass_hash: hash });
  if (error) return toast("Error: " + error.message, "error");
  toast(`✅ Usuario "${name}" creado con contraseña: ${pass}`);
  document.getElementById("newUserName").value = "";
  document.getElementById("newUserPass").value = "";
  await loadAll();
  renderAdmin();
}

function downloadPDF() {
  // Validar completitud
  const completed = Object.entries(state.predictions).filter(([id, p]) =>
    p && p.home !== "" && p.away !== "" && p.home != null && p.away != null
  ).length;
  if (completed < 72) {
    return toast(`Te faltan ${72 - completed} partidos por predecir`, "error");
  }
  if (!window.jspdf) return toast("Error al cargar generador PDF", "error");

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pageW = doc.internal.pageSize.getWidth();
  let y = 18;

  // Título
  doc.setFontSize(20);
  doc.setTextColor(15, 23, 42);
  doc.setFont(undefined, "bold");
  doc.text("Mundial 2026 - Quiniela", pageW / 2, y, { align: "center" });
  y += 8;

  doc.setFontSize(12);
  doc.setFont(undefined, "normal");
  doc.setTextColor(80, 80, 80);
  doc.text(`Participante: ${state.user.name}`, pageW / 2, y, { align: "center" });
  y += 5;
  doc.text(`Fecha: ${new Date().toLocaleDateString("es-ES", { day: "2-digit", month: "long", year: "numeric" })}`, pageW / 2, y, { align: "center" });
  y += 4;
  doc.setDrawColor(250, 204, 21);
  doc.setLineWidth(0.5);
  doc.line(20, y, pageW - 20, y);
  y += 8;

  doc.setTextColor(0, 0, 0);

  // Agrupar partidos por fecha
  const byDate = {};
  MATCHES.forEach(m => {
    if (!byDate[m.date]) byDate[m.date] = [];
    byDate[m.date].push(m);
  });
  const sortedDates = Object.keys(byDate).sort((a, b) => dateSortKey(a) - dateSortKey(b));

  // Dos columnas
  let col = 0;
  let yLeft = y, yRight = y;
  const colWidth = (pageW - 40) / 2;
  const xLeft = 20, xRight = 20 + colWidth + 5;

  sortedDates.forEach(d => {
    const x = col === 0 ? xLeft : xRight;
    let yCol = col === 0 ? yLeft : yRight;

    // Salto de página si no cabe (estimar altura: 6 header + 4.5 por partido + 3)
    const estHeight = 9 + byDate[d].length * 4.5;
    if (yCol + estHeight > 280) {
      doc.addPage();
      yLeft = 20;
      yRight = 20;
      yCol = 20;
    }

    doc.setFontSize(11);
    doc.setFont(undefined, "bold");
    doc.setTextColor(15, 23, 42);
    doc.setFillColor(250, 204, 21);
    doc.rect(x, yCol - 4, colWidth - 5, 6, "F");
    doc.text(d, x + 2, yCol);
    yCol += 6;

    doc.setFontSize(8.5);
    doc.setFont(undefined, "normal");
    doc.setTextColor(40, 40, 40);

    byDate[d].forEach(m => {
      const p = state.predictions[m.id];
      const trim = (s) => s.length > 13 ? s.substring(0, 12) + "." : s;
      const homeTeam = trim(m.home);
      const awayTeam = trim(m.away);
      doc.setFont(undefined, "normal");
      doc.text(`(${m.group})`, x + 1, yCol);
      doc.text(homeTeam, x + 8, yCol);
      doc.setFont(undefined, "bold");
      doc.text(`${p.home}-${p.away}`, x + colWidth/2 + 2, yCol, { align: "center" });
      doc.setFont(undefined, "normal");
      doc.text(awayTeam, x + colWidth - 7, yCol, { align: "right" });
      yCol += 4.5;
    });
    yCol += 3;

    if (col === 0) yLeft = yCol; else yRight = yCol;
    col = (col + 1) % 2;
  });

  // Footer
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(128, 128, 128);
    doc.text("Marcador exacto: 3 pts  |  Solo ganador: 1 pt", pageW / 2, 285, { align: "center" });
    doc.text(`Página ${i} de ${pageCount}`, pageW / 2, 290, { align: "center" });
  }

  const safeName = state.user.name.replace(/[^a-zA-Z0-9]/g, "_");
  doc.save(`mundial2026-quiniela-${safeName}.pdf`);
  toast("📄 PDF descargado");
}

window.onDownloadPDF = downloadPDF;

window.go = go;
window.logout = logout;
window.doLogin = doLogin;
window.setGroup = setGroup;
window.unlockAdmin = unlockAdmin;
window.clearResult = clearResult;
window.exitAdmin = exitAdmin;

// =====================================================================
//  Boot
// =====================================================================
async function boot() {
  initSupabase();
  if (state.configError) return render();
  const saved = localStorage.getItem("mundial26_user");
  if (saved) {
    try {
      state.user = JSON.parse(saved);
      await loadAll();
      state.view = "predict";
    } catch (e) { state.user = null; }
  }
  render();
}

boot();
</script>
</body>
</html>
