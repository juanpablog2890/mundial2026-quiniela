// =====================================================================
//  Hash simple SHA-256 para contraseñas
// =====================================================================
async function hashPass(pw) {
  const buf = new TextEncoder().encode(pw + "mundial26-salt");
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
}

// =====================================================================
//  Scoring: 3 pts marcador exacto, 1 pt ganador correcto, 0 si falla
// =====================================================================
function calcPoints(pred, result) {
  if (!pred || !result) return null;
  const ph = parseInt(pred.home), pa = parseInt(pred.away);
  const rh = parseInt(result.home), ra = parseInt(result.away);
  if (isNaN(ph) || isNaN(pa) || isNaN(rh) || isNaN(ra)) return null;
  if (ph === rh && pa === ra) return SCORING.EXACT;
  const pw = ph > pa ? "h" : pa > ph ? "a" : "d";
  const rw = rh > ra ? "h" : ra > rh ? "a" : "d";
  return pw === rw ? SCORING.WINNER : 0;
}

// =====================================================================
//  Toast

function toast(msg, type = "ok") {
  const old = document.querySelector(".toast");
  if (old) old.remove();
  const el = document.createElement("div");
  el.className = "toast" + (type === "error" ? " error" : "");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

// =====================================================================
//  Carga de datos remota
// =====================================================================
async function loadAll() {
  if (!state.sb) return;
  try {
    const [users, preds, res] = await Promise.all([
      state.sb.from("users").select("name"),
      state.sb.from("predictions").select("*"),
      state.sb.from("results").select("*"),
    ]);
    state.allUsers = users.data || [];
    state.allPredictions = preds.data || [];
    state.results = {};
    (res.data || []).forEach(r => {
      state.results[r.match_id] = { home: r.home_score, away: r.away_score };
    });
    if (state.user) {
      state.predictions = {};
      state.allPredictions
        .filter(p => p.user_name === state.user.name)
        .forEach(p => {
          state.predictions[p.match_id] = { home: p.home_score, away: p.away_score };
        });
    }
  } catch (e) {
    console.error(e);
    toast("Error al cargar datos", "error");
  }
}

  if (!name || !password) return toast("Completa nombre y contraseña", "error");
  const hash = await hashPass(password);
  const { data: existing } = await state.sb.from("users").select("*").eq("name", name).maybeSingle();
  if (existing) {
    if (existing.pass_hash !== hash) return toast("Contraseña incorrecta", "error");
  } else {
    const { error } = await state.sb.from("users").insert({ name, pass_hash: hash });
    if (error) return toast("No se pudo crear el usuario: " + error.message, "error");
    toast("¡Bienvenido " + name + "!");
  }
  state.user = { name };
  localStorage.setItem("mundial26_user", JSON.stringify(state.user));
  await loadAll();
  state.view = "predict";
  render();
}

function logout() {
  state.user = null;
  state.predictions = {};
  state.adminUnlocked = false;
  localStorage.removeItem("mundial26_user");
  state.view = "login";
  render();
}

// =====================================================================
//  Guardar predicción de un partido
// =====================================================================
async function savePrediction(matchId) {
  const p = state.predictions[matchId];
  if (!p || p.home === "" || p.away === "" || p.home == null || p.away == null) return;
  const h = parseInt(p.home), a = parseInt(p.away);
  if (isNaN(h) || isNaN(a) || h < 0 || a < 0) return;
  const { error } = await state.sb.from("predictions").upsert({
    user_name: state.user.name,
    match_id: matchId,
    home_score: h,
    away_score: a,
    updated_at: new Date().toISOString(),
  });
  if (error) toast("Error al guardar: " + error.message, "error");
}

function setPredField(matchId, side, val) {
  if (!state.predictions[matchId]) state.predictions[matchId] = { home: "", away: "" };
  state.predictions[matchId][side] = val;
}

// =====================================================================
//  Admin: guardar resultado real
// =====================================================================
async function saveResult(matchId, home, away) {
  const h = parseInt(home), a = parseInt(away);
  if (isNaN(h) || isNaN(a) || h < 0 || a < 0) return toast("Marcador inválido", "error");
  const { error } = await state.sb.from("results").upsert({
    match_id: matchId,
    home_score: h,
    away_score: a,
    updated_at: new Date().toISOString(),
  });
  if (error) return toast("Error: " + error.message, "error");
  state.results[matchId] = { home: h, away: a };
  toast("✅ Resultado guardado");
  renderAdmin();
  // refresh leaderboard data
  const { data: preds } = await state.sb.from("predictions").select("*");
  state.allPredictions = preds || [];
}

async function clearResult(matchId) {
  if (!confirm("¿Borrar el resultado de este partido?")) return;
  const { error } = await state.sb.from("results").delete().eq("match_id", matchId);
  if (error) return toast("Error: " + error.message, "error");
  delete state.results[matchId];
  toast("Resultado borrado");
  renderAdmin();
}

// =====================================================================
//  Tabla de posiciones
// =====================================================================
function getLeaderboard() {
  const totals = {};
  state.allUsers.forEach(u => { totals[u.name] = 0; });
  state.allPredictions.forEach(p => {
    const r = state.results[p.match_id];
    if (!r) return;
    const pts = calcPoints({ home: p.home_score, away: p.away_score }, r);
    if (pts != null && pts > 0) totals[p.user_name] = (totals[p.user_name] || 0) + pts;
  });
  return Object.entries(totals)
    .map(([name, pts]) => ({ name, pts }))
    .sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name));
}

// =====================================================================
//  RENDER
// =====================================================================
function render() {
  renderNav();
  if (state.configError) return renderConfigError();
  if (!state.user) return renderLogin();
  if (state.view === "predict") return renderPredict();
  if (state.view === "board") return renderBoard();
  if (state.view === "admin") return renderAdmin();
}

function renderNav() {
  const nav = document.getElementById("nav");
  if (!state.user) { nav.innerHTML = ""; return; }
  nav.innerHTML = `
    <button class="${state.view==='predict'?'active':''}" onclick="go('predict')">🎯 Mis Picks</button>
    <button class="${state.view==='board'?'active':''}" onclick="go('board')">🏆 Tabla</button>
    <button class="${state.view==='admin'?'active':''}" onclick="go('admin')">⚙️ Admin</button>
    <span class="badge">${state.user.name}</span>
    <button onclick="logout()">Salir</button>
  `;
}

function go(view) { state.view = view; render(); }

function renderConfigError() {
  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="config-warning">
        ⚠️ Falta configurar Supabase
      </div>
      <p>Antes de usar la app necesitas conectarla a tu proyecto Supabase. Abre el archivo <code>index.html</code> y reemplaza estas dos líneas (cerca de la línea 230):</p>
      <pre style="background:#000;padding:12px;border-radius:8px;overflow:auto;color:#facc15;">const SUPABASE_URL  = "https://TU_PROYECTO.supabase.co";
const SUPABASE_ANON = "eyJhbGc...";</pre>
      <p>Las consigues en <strong>supabase.com → Tu proyecto → Settings → API</strong>.</p>
      <p>Lee el archivo <strong>INSTRUCCIONES.md</strong> para la guía completa paso a paso.</p>
    </div>
  `;
}

function renderLogin() {
  document.getElementById("app").innerHTML = `
    <div class="card" style="max-width:420px;margin:40px auto;">
      <h1 style="text-align:center;">⚽ Mundial 2026</h1>
      <p style="text-align:center;">Pronostica los 72 partidos de la fase de grupos. Gana puntos por cada acierto.</p>
      <div class="form-row">
        <div>
          <label for="loginName">Tu nombre</label>
          <input type="text" id="loginName" placeholder="Ej: Jorge" autocomplete="username" />
        </div>
        <div>
          <label for="loginPass">Contraseña</label>
          <input type="password" id="loginPass" placeholder="••••••" autocomplete="current-password" />
        </div>
      </div>
      <button class="btn-primary" onclick="doLogin()">Entrar / Crear cuenta</button>
      <p class="small center" style="margin-top:12px;">
        🥇 Marcador exacto: <strong>3 pts</strong><br/>
        🎯 Solo ganador: <strong>1 pt</strong>
      </p>
    </div>
  `;
  // Enter para enviar
  document.getElementById("loginPass").addEventListener("keydown", e => {
    if (e.key === "Enter") doLogin();
  });
}

function doLogin() {
  const name = document.getElementById("loginName").value;
  const pass = document.getElementById("loginPass").value;
  login(name, pass);
}

function renderPredict() {
  const matches = MATCHES.filter(m => m.group === state.activeGroup);
  const groupTabs = Object.keys(GROUPS).map(g =>
    `<button class="${g===state.activeGroup?'active':''}" onclick="setGroup('${g}')">Grupo ${g}</button>`
  ).join("");

  const matchesHtml = matches.map(m => {
    const p = state.predictions[m.id] || { home: "", away: "" };
    const r = state.results[m.id];
    const pts = r ? calcPoints(p, r) : null;
    let badge = "";
    if (r) {
      const cls = pts === 3 ? "points-3" : pts === 1 ? "points-1" : "points-0";
      const label = pts === 3 ? "🎯 Exacto +3" : pts === 1 ? "✓ Ganador +1" : "✗ Sin acierto";
      badge = `<div class="match-points ${cls}">Resultado real: ${r.home}-${r.away} · ${label}</div>`;
    }
    return `
      <div class="match-row">
        <div class="match-team">
          <span class="flag">${flag(m.home)}</span>
          <span>${m.home}</span>
        </div>
        <div class="match-scores">
          <input type="number" min="0" value="${p.home}" id="ph_${m.id}"
            onchange="onPredChange('${m.id}','home',this.value)" />
          <span>-</span>
          <input type="number" min="0" value="${p.away}" id="pa_${m.id}"
            onchange="onPredChange('${m.id}','away',this.value)" />
        </div>
        <div class="match-team away">
          <span>${m.away}</span>
          <span class="flag">${flag(m.away)}</span>
        </div>
        <div class="match-meta">📅 ${m.date} · 🏟️ ${m.stadium}</div>
        ${badge}
      </div>
    `;
  }).join("");

  // Conteo de predicciones
  const totalPreds = Object.keys(state.predictions).filter(k => {
    const p = state.predictions[k];
    return p.home !== "" && p.away !== "" && p.home != null && p.away != null;
  }).length;

  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>🎯 Mis Predicciones</h2>
      <p class="small">Llena los marcadores. Se guarda automático al cambiar de campo. ${totalPreds}/72 partidos predichos.</p>
      <div class="group-tabs">${groupTabs}</div>
      <h3>Grupo ${state.activeGroup}</h3>
      ${matchesHtml}
    </div>
  `;
}

function setGroup(g) { state.activeGroup = g; renderPredict(); }

window.onPredChange = async function(matchId, side, val) {
  setPredField(matchId, side, val);
  await savePrediction(matchId);
};

function renderBoard() {
  const board = getLeaderboard();
  const totalResults = Object.keys(state.results).length;
  const rows = board.map((row, i) => {
    const rank = i + 1;
    const rankCls = rank === 1 ? "gold" : rank === 2 ? "silver" : rank === 3 ? "bronze" : "";
    const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : rank;
    const isMe = row.name === state.user.name ? "background:rgba(250,204,21,0.08);" : "";
    return `
      <tr style="${isMe}">
        <td class="rank ${rankCls}">${medal}</td>
        <td>${row.name}${row.name===state.user.name?' <span class="badge">tú</span>':''}</td>
        <td style="text-align:right;font-weight:700;color:#facc15;">${row.pts}</td>
      </tr>
    `;
  }).join("") || `<tr><td colspan="3" class="center small">Aún no hay usuarios registrados.</td></tr>`;

  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>🏆 Tabla de posiciones</h2>
      <p class="small">${totalResults}/72 partidos con resultado oficial · ${state.allUsers.length} participantes</p>
      <table class="leaderboard">
        <thead>
          <tr><th>#</th><th>Participante</th><th style="text-align:right;">Puntos</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function renderAdmin() {
  if (!state.adminUnlocked) {
    document.getElementById("app").innerHTML = `
      <div class="card" style="max-width:420px;margin:40px auto;">
        <h2>⚙️ Panel Admin</h2>
        <p>Ingresa la contraseña de admin para cargar los resultados oficiales de los partidos.</p>
        <div class="form-row">
          <div>
            <label>Contraseña de admin</label>
            <input type="password" id="adminPw" placeholder="••••••" />
          </div>
        </div>
        <button class="btn-primary" onclick="unlockAdmin()">Desbloquear</button>
      </div>
    `;
    document.getElementById("adminPw").addEventListener("keydown", e => {
      if (e.key === "Enter") unlockAdmin();
    });
    return;
  }

  const matches = MATCHES.filter(m => m.group === state.activeGroup);
  const groupTabs = Object.keys(GROUPS).map(g =>
    `<button class="${g===state.activeGroup?'active':''}" onclick="setGroup('${g}')">Grupo ${g}</button>`
  ).join("");

  const rows = matches.map(m => {
    const r = state.results[m.id] || { home: "", away: "" };
    return `
      <div class="match-row">
        <div class="match-team">
          <span class="flag">${flag(m.home)}</span><span>${m.home}</span>
        </div>
        <div class="match-scores">
          <input type="number" min="0" value="${r.home}" id="rh_${m.id}" />
          <span>-</span>
          <input type="number" min="0" value="${r.away}" id="ra_${m.id}" />
        </div>
        <div class="match-team away">
          <span>${m.away}</span><span class="flag">${flag(m.away)}</span>
        </div>
        <div class="match-meta">
          📅 ${m.date} · 🏟️ ${m.stadium}
          <button class="btn-secondary" style="margin-left:8px;padding:4px 12px;"
            onclick="onSaveResult('${m.id}')">💾 Guardar</button>
          ${state.results[m.id] ? `<button class="btn-secondary" style="margin-left:6px;padding:4px 12px;background:#7f1d1d;border-color:#991b1b;" onclick="clearResult('${m.id}')">🗑️</button>` : ''}
        </div>
      </div>
    `;
  }).join("");

  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>⚙️ Admin · Cargar resultados oficiales</h2>
      <p class="small">Selecciona el grupo y guarda los marcadores reales. Los puntos se calculan automático.</p>
      <div class="group-tabs">${groupTabs}</div>
      <h3>Grupo ${state.activeGroup}</h3>
      ${rows}
    </div>
  `;
}

function unlockAdmin() {
  const pw = document.getElementById("adminPw").value;
  if (pw === ADMIN_PASSWORD) {
    state.adminUnlocked = true;
    toast("🔓 Admin desbloqueado");
    renderAdmin();
  } else {
    toast("Contraseña incorrecta", "error");
  }
}

window.onSaveResult = function(matchId) {
  const h = document.getElementById("rh_" + matchId).value;
  const a = document.getElementById("ra_" + matchId).value;
  if (h === "" || a === "") return toast("Llena ambos marcadores", "error");
  saveResult(matchId, h, a);
};

window.go = go;
window.logout = logout;
window.doLogin = doLogin;
window.setGroup = setGroup;
window.unlockAdmin = unlockAdmin;
window.clearResult = clearResult;

// =====================================================================
//  Boot
// =====================================================================
async function boot() {
  initSupabase();
  if (state.configError) return render();
  const saved = localStorage.getItem("mundial26_user");
  if (saved) {
    try {
      state.user = JSON.parse(saved);
      await loadAll();
      state.view = "predict";
    } catch (e) { state.user = null; }
  }
  render();
}

boot();
</script>
</body>
</html>
